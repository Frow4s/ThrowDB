name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install source package and tests
        run: python -m pip install --upgrade pip && python -m pip install '.[test]'
      - name: Run Python suite
        run: python -m pytest -q
      - name: Run installed-package smoke test
        run: python tools/wheel_smoke.py

  native:
    name: Native C++20 / Werror
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DTHROWDB_BUILD_PYTHON=OFF
          -DTHROWDB_BUILD_BENCHMARKS=OFF
          -DCMAKE_CXX_FLAGS=-Werror
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DTHROWDB_BUILD_PYTHON=OFF
          -DTHROWDB_BUILD_BENCHMARKS=OFF
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined\ -fno-omit-frame-pointer
      - name: Build
        run: cmake --build build-sanitized --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure --parallel 2
