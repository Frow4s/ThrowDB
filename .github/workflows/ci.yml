name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    env:
      # The Python matrix validates the local extension and the always-present
      # gRPC client. The dedicated native gRPC job below builds the daemon once
      # with its pinned C++ toolchain instead of compiling gRPC five times.
      CMAKE_ARGS: >-
        -DTHROWDB_BUILD_SERVER=OFF
        -DTHROWDB_BUILD_GRPC_SERVER=OFF
      THROWDB_WHEEL_SMOKE_REQUIRE_SERVER: "0"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install source package and tests
        run: python -m pip install --upgrade pip && python -m pip install '.[test]'
      - name: Run Python suite
        run: python -m pytest -q
      - name: Run installed-package smoke test
        run: python tools/wheel_smoke.py

  grpc-server:
    name: Pinned C++ gRPC server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build pinned userspace gRPC and Protobuf
        env:
          THROWDB_GRPC_JOBS: "2"
          THROWDB_GRPC_PREFIX: ${{ runner.temp }}/throwdb-grpc
          THROWDB_GRPC_WORK_DIR: ${{ runner.temp }}/throwdb-grpc-work
        run: ./tools/bootstrap_grpc.sh
      - name: Configure
        env:
          THROWDB_GRPC_PREFIX: ${{ runner.temp }}/throwdb-grpc
        run: cmake --preset server-release
      - name: Build
        run: cmake --build --preset server-release
      - name: Test
        run: ctest --preset server-release
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python client and local extension for server integration
        env:
          CMAKE_ARGS: >-
            -DTHROWDB_BUILD_SERVER=OFF
            -DTHROWDB_BUILD_GRPC_SERVER=OFF
        run: python -m pip install '.[test]'
      - name: Test native server through Python client and benchmark runners
        env:
          THROWDB_SERVER_BINARY: ${{ github.workspace }}/build/server-release/throwdbd
        run: >-
          python -m pytest -q
          tests/server
          tests/test_grpc_server_benchmark.py::test_minimal_loopback_benchmark_smoke
          tests/test_grpc_server_soak.py::test_minimal_native_mixed_streaming_soak

  native:
    name: Native C++20 / Werror
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DTHROWDB_BUILD_PYTHON=OFF
          -DTHROWDB_BUILD_BENCHMARKS=OFF
          -DCMAKE_CXX_FLAGS=-Werror
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DTHROWDB_BUILD_PYTHON=OFF
          -DTHROWDB_BUILD_BENCHMARKS=OFF
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined\ -fno-omit-frame-pointer
      - name: Build
        run: cmake --build build-sanitized --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure --parallel 2
