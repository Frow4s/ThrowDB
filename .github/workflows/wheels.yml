name: Linux wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  wheels:
    name: manylinux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.1.0
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: throwdb-manylinux-x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Build sdist
        run: python -m pip install build && python -m build --sdist
      - name: Build pinned userspace gRPC and Protobuf
        env:
          THROWDB_GRPC_JOBS: "2"
          THROWDB_GRPC_PREFIX: ${{ runner.temp }}/throwdb-grpc
          THROWDB_GRPC_WORK_DIR: ${{ runner.temp }}/throwdb-grpc-work
        run: ./tools/bootstrap_grpc.sh
      - name: Test installed sdist in an isolated environment
        env:
          THROWDB_GRPC_PREFIX: ${{ runner.temp }}/throwdb-grpc
        run: |
          python -m venv "${RUNNER_TEMP}/throwdb-sdist-smoke"
          "${RUNNER_TEMP}/throwdb-sdist-smoke/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/throwdb-sdist-smoke/bin/python" -m pip install dist/*.tar.gz
          "${RUNNER_TEMP}/throwdb-sdist-smoke/bin/python" tools/wheel_smoke.py
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: throwdb-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
