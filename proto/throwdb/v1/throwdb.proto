syntax = "proto3";

package throwdb.v1;

option cc_enable_arenas = true;

// One process serves exactly one collection. Collection selection and a
// multi-collection catalog belong to a future service layer, not this API.
service ThrowDB {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc Get(GetRequest) returns (GetResponse);

  // Opens one pinned logical view, then exchanges bounded ID and embedding
  // batches in request order. Protocol v1 uses an application window of one:
  // the server writes one result before reading the next ID batch.
  rpc StreamGet(stream StreamGetRequest) returns (stream StreamGetResponse);

  rpc Insert(MutationRequest) returns (MutationResponse);
  rpc Update(MutationRequest) returns (MutationResponse);
  rpc Upsert(MutationRequest) returns (MutationResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // Pins one logical collection view and emits every live ID exactly once in
  // physical (segment_id, row_index) order. Each response is bounded by the
  // requested batch_rows and the server's configured message-byte limit.
  rpc ScanIds(ScanIdsRequest) returns (stream ScanIdsResponse);

  // Pins one logical collection view and emits every live record exactly once
  // in physical (segment_id, row_index) order.
  rpc ScanRecords(ScanRecordsRequest) returns (stream ScanRecordsResponse);
}

enum IdType {
  ID_TYPE_UNSPECIFIED = 0;
  ID_TYPE_UINT64 = 1;
  // Reserved by the protocol. Numeric format 7 currently returns
  // UNIMPLEMENTED for UTF-8 collections.
  ID_TYPE_UTF8 = 2;
}

enum EmbeddingDType {
  EMBEDDING_DTYPE_UNSPECIFIED = 0;
  EMBEDDING_DTYPE_FLOAT16 = 1;
  EMBEDDING_DTYPE_FLOAT32 = 2;
}

message UInt64Ids {
  uint64 count = 1;
  // Exactly count*8 bytes: numeric IDs encoded little-endian. A dense bytes
  // field avoids per-element protobuf work and maps directly to NumPy and the
  // C++ batch API after validation.
  bytes values_le = 2;
}

message Utf8Ids {
  repeated string values = 1;
}

message IdBatch {
  oneof encoding {
    UInt64Ids uint64_ids = 1;
    Utf8Ids utf8_ids = 2;
  }
}

message EmbeddingBatch {
  EmbeddingDType dtype = 1;
  uint32 dimension = 2;
  uint64 row_count = 3;
  // Dense row-major IEEE values in little-endian byte order. Its length must
  // equal row_count*dimension*element_size(dtype).
  bytes values_le = 4;
}

message OperationId {
  fixed64 high = 1;
  fixed64 low = 2;
}

message CollectionId {
  fixed64 low = 1;
  fixed64 high = 2;
}

message ScanToken {
  fixed64 high = 1;
  fixed64 low = 2;
}

message HealthRequest {}

message HealthResponse {
  enum ServingStatus {
    SERVING_STATUS_UNSPECIFIED = 0;
    SERVING_STATUS_SERVING = 1;
    SERVING_STATUS_NOT_SERVING = 2;
  }

  ServingStatus status = 1;
  uint32 protocol_major = 2;
  uint32 protocol_minor = 3;
}

message DescribeRequest {}

message Capabilities {
  bool writable = 1;
  bool prefix_get = 2;
  bool scan_locations = 3;
  // True when the server durably journals operation_id and can resolve an
  // interrupted request against WAL recovery. Clients must not retry an
  // ambiguous mutation while this is false.
  bool durable_idempotency = 4;
  bool stream_get = 5;
  bool scan_records = 6;
}

message CollectionSchema {
  IdType id_type = 1;
  EmbeddingDType embedding_dtype = 2;
  uint32 dimension = 3;
}

enum ReaderBackend {
  READER_BACKEND_UNSPECIFIED = 0;
  READER_BACKEND_THREAD_POOL = 1;
  READER_BACKEND_IO_URING = 2;
}

// The complete effective native reader configuration. These are the values
// used by the C++ data plane after persisted selection and explicit overrides
// have both been resolved by the one-shot startup control plane.
message ReaderConfiguration {
  uint64 max_read_range_bytes = 1;
  uint64 max_gap_bytes = 2;
  uint32 io_workers = 3;
  uint32 io_queue_capacity = 4;
  uint32 io_ranges_per_task = 5;
  ReaderBackend io_backend = 6;
  uint32 io_uring_queue_depth = 7;
  uint32 io_uring_workers = 8;
}

message TuningSelection {
  // auto, persisted, conservative, or the effective manual outcome produced
  // when explicit reader options bypass the profile registry.
  string mode = 1;
  // persisted, fallback, or manual.
  string source = 2;
  // Stable machine-readable outcome such as selected, registry_missing, or
  // explicit. No mode performs calibration during server startup.
  string status = 3;
  // exact, compatible, fallback, or manual.
  string reuse_level = 4;
  bool explicit_overrides = 5;
}

// Effective process-wide availability bounds. Unary and streaming memory are
// intentionally disjoint so a slow ScanIds consumer cannot starve Get/CRUD.
message AvailabilityConfiguration {
  uint32 max_concurrent_calls = 1;
  uint32 max_concurrent_scans = 2;
  uint64 max_unary_inflight_bytes = 3;
  uint64 max_scan_inflight_bytes = 4;
  uint64 max_grpc_memory_bytes = 5;
  uint32 scan_max_duration_millis = 6;
  uint32 scan_idle_timeout_millis = 7;
  uint32 shutdown_grace_millis = 8;
  uint32 shutdown_hard_timeout_millis = 9;
}

// A point-in-time view of application-level admission. Counters cover only
// requests that reached the admission gate; validation failures before that
// point are reported as ordinary RPC errors and are not included here.
message AdmissionStatistics {
  uint32 active_unary_calls = 1;
  uint32 active_scans = 2;
  uint64 unary_estimated_bytes = 3;
  uint64 scan_estimated_bytes = 4;
  uint64 admitted_unary_calls = 5;
  uint64 rejected_unary_calls = 6;
  uint64 admitted_scans = 7;
  uint64 rejected_scans = 8;
  bool admission_closed = 9;
  bool draining = 10;
  bool terminal_faulted = 11;
}

// Bounded operational state needed by alerting and capacity automation. These
// values are a point-in-time snapshot; counters may change immediately after
// Describe returns.
message EngineStatistics {
  uint64 catalog_generation = 1;
  uint64 committed_sequence = 2;
  uint64 materialized_sequence = 3;
  uint64 active_wal_bytes = 4;
  uint64 active_wal_transactions = 5;
  uint64 active_wal_operations = 6;
  uint64 frozen_wal_count = 7;
  uint64 frozen_wal_bytes = 8;
  uint64 total_wal_bytes = 9;
  uint64 total_wal_operations = 10;
  uint64 overlay_entries = 11;
  uint64 estimated_overlay_bytes = 12;
  uint64 delta_run_count = 13;
  uint64 total_delta_run_bytes = 14;
  uint64 total_delta_segment_bytes = 15;
  uint64 idempotency_journal_bytes = 16;
  uint64 idempotency_completed_operations = 17;
  uint64 idempotency_aborted_operations = 18;
  uint64 idempotency_max_bytes = 19;
  uint64 idempotency_max_operations = 20;
  uint64 idempotency_generation = 21;
  uint64 filesystem_available_bytes = 22;
  uint64 mutation_disk_reserve_bytes = 23;
  bool maintenance_active = 24;
}

// Effective bounded workload-logging policy. Workload logging is disabled
// unless directory is explicitly configured by the server operator. The
// directory is intentionally outside the collection and is not authoritative
// collection state.
message ReadLoggingConfiguration {
  bool enabled = 1;
  // Reserved: local filesystem paths are process diagnostics and must not be
  // disclosed to remote data-plane clients.
  reserved 2;
  // Protocol v1.4 compatibility aliases. A v1.5 server always reports full
  // selection and maps the physical chunk bound to max_ids_per_event.
  uint32 sample_ppm = 3;
  uint32 max_ids_per_event = 4;
  uint64 buffer_bytes = 5;
  uint64 segment_bytes = 6;
  uint64 rotate_seconds = 7;
  uint64 retention_bytes = 8;
  uint64 retention_seconds = 9;
  uint64 minimum_free_bytes = 10;
  uint64 max_write_bytes_per_second = 11;
  uint64 max_retained_files = 12;
  // Maximum ordered IDs in one physical log record. Logical requests may
  // span any number of contiguous records without sampling or truncation.
  uint32 id_chunk_rows = 13;
  // Native workload-log schema written by this process.
  uint32 format_version = 14;
}

// Monotonic process-local counters plus the current bounded queue/disk state.
// A sampled event may still be dropped by backpressure, disk pressure, or a
// non-fatal writer error; those failures never fail the read RPC itself.
message ReadLoggingStatistics {
  bool enabled = 1;
  // Protocol-v1.4 compatibility counters. Protocol-v1.5 servers populate
  // these from the request-lifecycle counters below without sampling:
  // considered and sampled map to observed_requests, enqueued maps to
  // begun_requests, written maps to complete_requests, and truncated is zero.
  uint64 considered_events = 2;
  uint64 sampled_events = 3;
  uint64 enqueued_events = 4;
  uint64 written_events = 5;
  uint64 truncated_events = 6;
  uint64 captured_ids = 7;
  uint64 dropped_queue_events = 8;
  uint64 dropped_disk_pressure_events = 9;
  uint64 dropped_error_events = 10;
  uint64 bytes_written = 11;
  uint64 segments_created = 12;
  uint64 retained_bytes = 13;
  uint64 retained_segments = 14;
  uint64 queue_bytes = 15;
  uint64 peak_queue_bytes = 16;
  uint64 retention_deleted_bytes = 17;
  uint64 retention_deleted_segments = 18;
  uint64 writer_errors = 19;
  uint64 observed_ids = 20;
  uint64 unsampled_events = 21;
  uint64 dropped_busy_events = 22;
  uint64 dropped_full_events = 23;
  uint64 rotated_segments = 24;
  uint64 queued_events = 25;
  uint64 buffer_capacity_bytes = 26;
  int32 last_error_number = 27;
  bool paused_for_minimum_free_space = 28;
  bool runtime_failed = 29;
  bool shutting_down = 30;
  uint64 sampled_ids = 31;
  uint64 enqueued_ids = 32;
  uint64 written_ids = 33;
  uint64 dropped_busy_ids = 34;
  uint64 dropped_full_ids = 35;
  uint64 dropped_error_ids = 36;
  uint64 dropped_disk_pressure_ids = 37;
  uint64 dropped_io_budget_events = 38;
  uint64 dropped_io_budget_ids = 39;

  // Protocol-v1.5 logical-request lifecycle. A request is observed after its
  // first valid ID batch is decoded, and completed when its single terminal
  // outcome is submitted. Only complete_requests are eligible for training.
  uint64 observed_requests = 40;
  uint64 begun_requests = 41;
  uint64 completed_requests = 42;
  uint64 complete_requests = 43;
  uint64 incomplete_requests = 44;

  // Physical framed-record pipeline. One logical request contains one begin,
  // any number of ordered ID chunks and batch-metric records, and one end.
  uint64 observed_records = 45;
  uint64 enqueued_records = 46;
  uint64 written_records = 47;
  uint64 observed_id_chunks = 48;
  uint64 enqueued_id_chunks = 49;
  uint64 written_id_chunks = 50;
  uint64 observed_batches = 51;
  uint64 enqueued_batches = 52;
  uint64 written_batches = 53;
  uint64 dropped_full_records = 54;
  uint64 dropped_runtime_failure_records = 55;
  uint64 dropped_minimum_free_space_records = 56;
  uint64 dropped_io_budget_records = 57;
  uint64 queued_records = 58;
  uint64 active_requests = 59;
}

message DescribeResponse {
  uint32 format_version = 1;
  CollectionSchema schema = 2;
  uint64 record_size = 3;
  uint64 count = 4;
  Capabilities capabilities = 5;
  ReaderConfiguration reader = 6;
  TuningSelection tuning = 7;
  AvailabilityConfiguration availability = 8;
  // Required when a protocol-minor >= 1 server advertises durable idempotency.
  // Protocol v1.0 predates this field and may omit it during rolling upgrades.
  // A v1.1+ journal checkpoint changes the domain so delayed retries from the
  // previous replay history fail closed.
  OperationId idempotency_domain = 9;
  AdmissionStatistics admission_stats = 10;
  EngineStatistics engine_stats = 11;
  ReadLoggingConfiguration read_logging = 12;
  ReadLoggingStatistics read_logging_stats = 13;
}

message GetRequest {
  IdBatch ids = 1;
  // Zero means the collection's complete dimension.
  uint32 prefix_dimensions = 2;
}

message GetResponse {
  EmbeddingBatch embeddings = 1;
}

// Snapshot metadata is repeated on every streaming response. The token is
// cursor-scoped, opaque, and nonzero. It is not resumable or accepted by
// another RPC in protocol v1.
message ReadSnapshot {
  CollectionId collection_id = 1;
  uint64 catalog_generation = 2;
  uint64 committed_sequence = 3;
  uint64 live_count = 4;
  ScanToken token = 5;
}

message StreamGetOpen {
  // Zero means the collection's complete dimension.
  uint32 prefix_dimensions = 1;
  // Zero lets the server choose. A nonzero value is a client-side ceiling;
  // the server may negotiate a smaller batch.
  uint32 max_batch_rows = 2;
  // Maximum dense response payload bytes, excluding protobuf framing. Zero
  // lets the server choose.
  uint64 max_batch_payload_bytes = 3;
}

message StreamGetInputBatch {
  // Starts at zero and must be contiguous within this stream.
  uint64 sequence = 1;
  IdBatch ids = 2;
}

message StreamGetRequest {
  oneof payload {
    // Must be the first and only open frame.
    StreamGetOpen open = 1;
    StreamGetInputBatch batch = 2;
  }
}

message StreamGetOpened {
  EmbeddingDType dtype = 1;
  uint32 dimension = 2;
  uint32 max_batch_rows = 3;
  uint64 max_batch_payload_bytes = 4;
  // Protocol v1 is deliberately stop-and-wait. A later minor version may
  // negotiate a larger bounded window without changing message shapes.
  uint32 request_window = 5;
}

message StreamGetOutputBatch {
  uint64 sequence = 1;
  // Number of rows returned by earlier batches in this stream.
  uint64 input_offset = 2;
  EmbeddingBatch embeddings = 3;
}

message StreamGetResponse {
  ReadSnapshot snapshot = 1;
  oneof payload {
    StreamGetOpened opened = 2;
    StreamGetOutputBatch batch = 3;
  }
}

message MutationRequest {
  // Required and nonzero. Reusing it with the same operation and payload
  // returns the original committed result; reusing it for another payload is
  // rejected. Retry only when Describe advertises durable_idempotency.
  OperationId operation_id = 1;
  IdBatch ids = 2;
  EmbeddingBatch embeddings = 3;
  // Must match Describe.idempotency_domain for a durable v1.1+ server. It is
  // absent when talking to a legacy protocol-v1.0 server.
  OperationId idempotency_domain = 4;
}

message MutationResponse {
  uint64 committed_sequence = 1;
  uint64 affected_count = 2;
}

message DeleteRequest {
  OperationId operation_id = 1;
  IdBatch ids = 2;
  // Must match Describe.idempotency_domain for a durable v1.1+ server. It is
  // absent when talking to a legacy protocol-v1.0 server.
  OperationId idempotency_domain = 3;
}

message DeleteResponse {
  uint64 committed_sequence = 1;
  uint64 affected_count = 2;
  // Exactly affected_count bytes. Values are restricted to 0 and 1 and
  // preserve request order.
  bytes deleted_mask = 3;
}

message ScanIdsRequest {
  uint32 batch_rows = 1;
  bool include_locations = 2;
}

message IdScanSnapshot {
  CollectionId collection_id = 1;
  uint64 catalog_generation = 2;
  uint64 committed_sequence = 3;
  uint64 count = 4;
  // Cursor-scoped, opaque, and nonzero. It is not an authorization secret and
  // is not resumable after the stream ends in protocol v1.
  ScanToken token = 5;
}

enum LocationEncoding {
  LOCATION_ENCODING_UNSPECIFIED = 0;
  // Exactly row_count*8 bytes, each row encoded as little-endian
  // (uint32 segment_id, uint32 row_index).
  LOCATION_ENCODING_SEGMENT_ROW_U32_LE = 1;
}

message ScanIdsResponse {
  IdScanSnapshot snapshot = 1;
  uint64 emitted_offset = 2;
  IdBatch ids = 3;
  LocationEncoding location_encoding = 4;
  bytes locations_le = 5;
}

message ScanRecordsRequest {
  // Required client-side row ceiling. The server may emit fewer rows to honor
  // response and admission-memory bounds.
  uint32 batch_rows = 1;
  // Maximum dense response payload bytes (IDs, embeddings, and optional
  // locations), excluding protobuf framing. Zero lets the server choose.
  uint64 max_batch_payload_bytes = 2;
  // Zero means the collection's complete dimension.
  uint32 prefix_dimensions = 3;
  bool include_locations = 4;
}

message ScanRecordsResponse {
  ReadSnapshot snapshot = 1;
  uint64 emitted_offset = 2;
  IdBatch ids = 3;
  EmbeddingBatch embeddings = 4;
  LocationEncoding location_encoding = 5;
  bytes locations_le = 6;
  uint32 max_batch_rows = 7;
  uint64 max_batch_payload_bytes = 8;
}
