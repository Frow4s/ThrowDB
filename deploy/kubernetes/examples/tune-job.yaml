# Run only with the server scaled to zero. Use the same image, CPU/memory,
# runtime security profile, node and PVC that the final StatefulSet will use.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: throwdb-tune-
  namespace: throwdb
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: throwdb-tune
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tune
          image: throwdb:0.1.0
          command:
            - throwdb
          args:
            - tune
            - --storage
            - /var/lib/throwdb/collection
            - --max-seconds
            - "300"
            - --max-read-gib
            - "8"
            - --max-memory-mib
            - "512"
            - --output
            - /var/lib/throwdb/tune-report.json
          resources:
            requests:
              cpu: "16"
              memory: 64Gi
            limits:
              cpu: "16"
              memory: 64Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/throwdb
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: throwdb-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
