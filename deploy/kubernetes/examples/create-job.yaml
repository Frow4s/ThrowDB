# Offline example: keep the StatefulSet at replicas=0 while this Job owns the
# collection PVC. The input PVC and filenames are placeholders.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: throwdb-create-
  namespace: throwdb
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: throwdb-create
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create
          image: throwdb:0.1.0
          command:
            - throwdb
          args:
            - create
            - --storage
            - /var/lib/throwdb/collection
            - --ids
            - /source/ids.npy
            - --embeddings
            - /source/embeddings.npy
            - --format-version
            - "7"
            - --batch-rows
            - "65536"
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
            limits:
              cpu: "8"
              memory: 32Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/throwdb
            - name: source
              mountPath: /source
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: throwdb-data
        - name: source
          persistentVolumeClaim:
            claimName: REPLACE_WITH_SOURCE_PVC
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
