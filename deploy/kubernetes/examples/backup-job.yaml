# Requires an operator image containing ThrowDB plus a current AWS CLI. This
# Job is safe only while the writable StatefulSet is scaled to zero, or against
# a writable clone of a quiesced storage snapshot. Configure workload identity
# on the service account instead of placing long-lived AWS keys here.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: throwdb-backup-
  namespace: throwdb
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: throwdb-backup
    spec:
      restartPolicy: Never
      serviceAccountName: throwdb-backup
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          image: REPLACE_WITH_THROWDB_OPS_IMAGE
          command:
            - throwdb
          args:
            - backup
            - s3
            - --storage
            - /var/lib/throwdb/collection
            - --destination
            - s3://REPLACE_BUCKET/throwdb/REPLACE_COLLECTION
            - --max-seconds
            - "41400"
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/throwdb
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: throwdb-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
