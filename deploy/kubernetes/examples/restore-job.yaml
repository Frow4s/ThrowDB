# Restore always creates a new directory. Point the StatefulSet at that path
# only after verification; never restore over the active collection.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: throwdb-restore-
  namespace: throwdb
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: throwdb-restore
    spec:
      restartPolicy: Never
      serviceAccountName: throwdb-backup
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restore
          image: REPLACE_WITH_THROWDB_OPS_IMAGE
          command:
            - throwdb
          args:
            - restore
            - s3
            - --source
            - s3://REPLACE_BUCKET/throwdb/REPLACE_COLLECTION
            - --storage
            - /var/lib/throwdb/restored-REPLACE_BACKUP_ID
            - --expected-backup-id
            - REPLACE_BACKUP_ID
            - --max-seconds
            - "41400"
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/throwdb
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: throwdb-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
