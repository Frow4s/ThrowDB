apiVersion: v1
kind: Service
metadata:
  name: throwdb-internal
  namespace: throwdb
  labels:
    app.kubernetes.io/name: throwdb
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: throwdb
  ports:
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: grpc
      appProtocol: grpc
