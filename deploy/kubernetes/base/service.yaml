apiVersion: v1
kind: Service
metadata:
  name: throwdb
  namespace: throwdb
  labels:
    app.kubernetes.io/name: throwdb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: throwdb
  ports:
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: grpc
      appProtocol: grpc
