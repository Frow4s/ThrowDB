[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "throwdb"
version = "0.1.0"
description = "Read-optimized disk-backed embedding storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
throwdb = "throwdb.cli:main"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/throwdb"]

[tool.scikit-build.cmake.define]
THROWDB_BUILD_TESTS = "OFF"
THROWDB_BUILD_BENCHMARKS = "OFF"
THROWDB_INSTALL_CPP_SDK = "OFF"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-manylinux_i686"
build-verbosity = 1
test-command = "python {project}/tools/wheel_smoke.py"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "2" }

[tool.pytest.ini_options]
testpaths = ["tests"]
